<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes & Messages Wall</title>
    <link href="https://fonts.googleapis.com/css2?family=Oooh+Baby&display=swap" rel="stylesheet">
    <style>
        /* Standalone Message Cards Styling */
        body { font-family: sans-serif; background-color: transparent; margin: 0; padding: 20px; }
        
        #wall-container { max-width: 500px; margin: 0 auto; text-align: center; }
        #wall-container h3 { font-family: 'Times New Roman', serif; font-size: 28px; color: #000000; margin-bottom: 15px; }
        
        .gallery-carousel { position: relative; width: 100%; min-height: 200px; margin: 0 auto; }
        .wall-card { 
            background: #f7e6ca; 
            border: none; 
            padding: 20px; 
            border-radius: 0px; 
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
            display: none;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }
        .wall-card.active { display: block; }
        .wall-card h4 { margin: 0 0 5px 0; color: #333; font-size: 1.1em; }
        
        /* Message text set to 'Oooh Baby' font */
        .wall-card p { 
            margin: 5px 0; 
            color: #444; 
            font-size: 1.25em; 
            font-family: 'Oooh Baby', cursive; 
            word-break: break-word; 
        }

        /* UIPageControl-style Dot Indicators */
        .page-control-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #d1ccb8;
            border-radius: 50%;
            transition: background-color 0.3s, transform 0.3s;
        }
        .dot.active {
            background-color: #818362;
            transform: scale(1.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="wall-container">
        <h3>Wishes & Messages</h3>
        <div class="gallery-carousel">
            <div id="messagesList">Loading messages...</div>
        </div>
        <!-- UIPageControl Dot Indicators Container -->
        <div id="pageControl" class="page-control-dots"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKqLhcL4m7xxhinbs9udTAEnoq_X435MoZ6li92mBMq4n4MPbgdcfRNLKv4DNZ2amt/exec";
        
        let currentIndex = 0;
        let totalMessages = 0;
        let autoRotateInterval = null;

        window.onload = function() {
            loadPublicMessages();
        };

        async function loadPublicMessages() {
            const listEl = document.getElementById('messagesList');
            const pageControlEl = document.getElementById('pageControl');
            try {
                const response = await fetch(SCRIPT_URL);
                const messages = await response.json();
                
                if (messages.length === 0) {
                    listEl.innerHTML = "<p style='text-align: center; color: #888; font-family: sans-serif; font-size: 1em;'>No messages yet. Be the first to leave a wish!</p>";
                    pageControlEl.innerHTML = "";
                    return;
                }

                messages.reverse();
                totalMessages = messages.length;

                let html = "";
                let dotsHtml = "";

                messages.forEach((item, index) => {
                    let messageContent = "";
                    const msgText = item.message || "";
                    const gifRegex = /(https?:\/\/[^\s]+\.gif(\?[^\s]*)?)/gi;

                    if (gifRegex.test(msgText)) {
                        let textOnly = msgText.replace(gifRegex, '').trim();
                        if (textOnly) {
                            messageContent += `<p>"${textOnly}"</p>`;
                        }
                        const matches = msgText.match(gifRegex);
                        if (matches) {
                            matches.forEach(url => {
                                messageContent += `<img src="${url}" alt="GIF" style="max-width: 100%; border-radius: 0px; margin-top: 8px; display: block; margin-left: auto; margin-right: auto;">`;
                            });
                        }
                    } else if (msgText.trim() !== "") {
                        messageContent += `<p>"${msgText}"</p>`;
                    }

                    const activeClass = index === 0 ? "active" : "";
                    html += `
                        <div class="wall-card ${activeClass}" data-index="${index}">
                            <h4>${item.name}</h4>
                            ${messageContent}
                        </div>
                    `;

                    dotsHtml += `<div class="dot ${activeClass}" data-dot-index="${index}"></div>`;
                });
                
                listEl.innerHTML = html;
                pageControlEl.innerHTML = dotsHtml;
                currentIndex = 0;
                updateGalleryDisplay();
                
                if (totalMessages > 1) {
                    startAutoRotate();
                }
            } catch (e) {
                listEl.innerHTML = "<p style='text-align: center; color: #dca1a1; font-family: sans-serif; font-size: 1em;'>Unable to load messages.</p>";
                pageControlEl.innerHTML = "";
            }
        }

        function updateGalleryDisplay() {
            const cards = document.querySelectorAll('.wall-card');
            cards.forEach((card, index) => {
                if (index === currentIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function startAutoRotate() {
            if (autoRotateInterval) clearInterval(autoRotateInterval);
            autoRotateInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % totalMessages;
                updateGalleryDisplay();
            }, 3000);
        }
    </script>
</body>
</html>
