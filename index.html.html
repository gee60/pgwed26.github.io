<!-- Created by Genesis de jesus 8/14/2026-->




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: transparent; }
        h2 { font-family: 'Times New Roman', font-size: 48px; color: #000000; margin-bottom: 20px; }
        .input-field { width: 85%; max-width: 400px; padding: 15px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; outline: none; margin: 10px auto; display: block; }
        .input-field:focus { border-color: #818362; }
        .hidden { display: none; }
        .btn { padding: 12px 25px; margin: 10px 5px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; transition: opacity 0.3s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .search-btn { background-color: #b7a9d7; color: white; width: 85%; max-width: 435px; }
        .yes { background-color: #818362; color: white; }
        .no { background-color: #691420; color: white; }
        #status-box { margin-top: 20px; padding: 25px; border: 1px solid #eee; border-radius: 12px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        select { padding: 12px; border-radius: 8px; border: 2px solid #ddd; width: 85%; max-width: 435px; font-size: 16px; margin-bottom: 10px; }
        #validation-msg { color: #d9534f; font-size: 0.9em; margin-bottom: 10px; font-weight: bold; }
        #feedback { margin-top: 15px; font-style: italic; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <h2>FIND YOUR INVITATION</h2>
    <input type="text" id="nameInput" class="input-field" placeholder="Full Name">
    <input type="text" id="accessCode" class="input-field" placeholder="4-Digit Access Code">
    <button onclick="searchName()" class="btn search-btn">Search Invitation</button>

    <div id="status-box" class="hidden">
        <p id="welcomeMsg" style="font-size: 1.3em; color: #333;"></p>
        <p>Current Status: <strong id="currentStatus"></strong></p>
        
        <div id="rsvp-actions">
            <hr style="border:0; border-top: 1px solid #eee; margin: 20px 0;">
            <div id="companion-area" class="hidden">
                <p>Will you be bringing any companions?</p>
                <select id="companionCount" onchange="toggleCompanionNames()"></select>
                <div id="names-input-area" class="hidden">
                    <p>Please list their names (separated by commas):</p>
                    <textarea id="compNamesInput" class="input-field" oninput="validateNames()" placeholder="e.g. Gen dejesus, Pam dela Cruz" rows="3"></textarea>
                    <p id="validation-msg"></p>
                </div>
            </div>
            <p>Please confirm your attendance:</p>
            <button id="submitYes" onclick="updateRSVP('Attending')" class="btn yes">I'm Attending</button>
            <button onclick="updateRSVP('Not Attending')" class="btn no">I Can't Make It</button>
        </div>

        <div id="locked-msg" class="hidden">
            <hr style="border:0; border-top: 1px solid #eee; margin: 20px 0;">
            <p id="confirmationText" style="font-weight: bold; font-size: 1.1em;"></p>
        </div>
    </div>
    <p id="feedback"></p>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2ZRp0P3i0mOmNaXoiyvicgpRTLObFQeedurraA5GNzxzvLLil0tomDAGauY3Nx6wv/exec";

        function setConfirmationMessage(status) {
            const textElement = document.getElementById('confirmationText');
            const statusLower = String(status).toLowerCase();
            if (statusLower.includes("attending") && !statusLower.includes("not")) {
                textElement.innerHTML = 'Your RSVP is confirmed. Visit our <a href="https://www.pamgen2026.com" style="color: #818362; text-decoration: underline;">website</a> for details!';
                textElement.style.color = "#818362";
            } else {
                textElement.innerText = "Your RSVP is confirmed. We're sorry you can't make it!";
                textElement.style.color = "#691420";
            }
            document.getElementById('locked-msg').classList.remove('hidden');
        }

        function validateNames() {
            const countRequired = parseInt(document.getElementById('companionCount').value);
            const text = document.getElementById('compNamesInput').value.trim();
            const submitBtn = document.getElementById('submitYes');
            const msg = document.getElementById('validation-msg');
            if (countRequired === 0 || isNaN(countRequired)) { submitBtn.disabled = false; msg.innerText = ""; return; }
            const namesArray = text.split(',').filter(name => name.trim().length > 0);
            if (namesArray.length !== countRequired) {
                submitBtn.disabled = true;
                msg.innerText = `Please enter exactly ${countRequired} name(s).`;
                msg.style.color = "#d9534f";
            } else {
                submitBtn.disabled = false;
                msg.innerText = "✓ Names confirmed.";
                msg.style.color = "#818362";
            }
        }

        function toggleCompanionNames() {
            const count = document.getElementById('companionCount').value;
            document.getElementById('names-input-area').className = (count > 0) ? "" : "hidden";
            validateNames();
        }

        async function searchName() {
            const name = document.getElementById('nameInput').value.trim();
            const code = document.getElementById('accessCode').value.trim();
            const feedbackEl = document.getElementById('feedback');

            if (!name || !code) {
                feedbackEl.style.color = "#d9534f";
                feedbackEl.innerText = "Please enter both your full name and access code.";
                return;
            }

            feedbackEl.style.color = "#333";
            feedbackEl.innerText = "Verifying...";
            
            try {
                const response = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}&code=${encodeURIComponent(code)}`);
                const text = await response.text();
                
                if (text === "Invalid Code" || text === "Not Found") {
                    feedbackEl.style.color = "#d9534f";
                    feedbackEl.innerText = text === "Invalid Code" ? "Incorrect access code. Please try again or contact Pam/Gen" : "Name not found on the guest list.";
                    document.getElementById('status-box').className = "hidden";
                } else {
                    const data = JSON.parse(text);
                    feedbackEl.innerText = "";
                    document.getElementById('welcomeMsg').innerText = `Hello, ${name}!`;
                    document.getElementById('currentStatus').innerText = data.status;
                    document.getElementById('status-box').className = "";
                    if (data.status !== "Pending") {
                        document.getElementById('rsvp-actions').className = "hidden";
                        setConfirmationMessage(data.status);
                    } else {
                        document.getElementById('rsvp-actions').className = "";
                        document.getElementById('locked-msg').className = "hidden";
                        const select = document.getElementById('companionCount');
                        select.innerHTML = "";
                        for (let i = 0; i <= data.max; i++) {
                            let opt = document.createElement('option');
                            opt.value = i; opt.innerHTML = i === 0 ? "Just me" : `Me + ${i} companion(s)`;
                            select.appendChild(opt);
                        }
                        document.getElementById('companion-area').className = (data.max > 0) ? "" : "hidden";
                        validateNames();
                    }
                }
            } catch (e) { 
                feedbackEl.style.color = "#d9534f";
                feedbackEl.innerText = "Error connecting to the server."; 
            }
        }

        async function updateRSVP(newStatus) {
            const name = document.getElementById('nameInput').value;
            const companions = document.getElementById('companionCount').value || 0;
            const companionNames = document.getElementById('compNamesInput').value || "";
            const feedbackEl = document.getElementById('feedback');

            feedbackEl.style.color = "#333";
            feedbackEl.innerText = "Saving...";
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ name: name, status: newStatus, companions: companions, companionNames: companionNames })
                });
                if (await response.text() === "Success") {
                    const displayStatus = companions > 0 ? `${newStatus} (+${companions})` : newStatus;
                    document.getElementById('currentStatus').innerText = displayStatus;
                    document.getElementById('rsvp-actions').className = "hidden";
                    setConfirmationMessage(displayStatus);
                    feedbackEl.innerText = "";
                } else {
                    feedbackEl.style.color = "#d9534f";
                    feedbackEl.innerText = "Failed to update RSVP.";
                }
            } catch (e) { 
                feedbackEl.style.color = "#d9534f";
                feedbackEl.innerText = "Failed to save."; 
            }
        }
    </script>
</body>
</html>
