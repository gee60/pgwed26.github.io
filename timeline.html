<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Timeline</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif, sans-serif;
            background-color: #f7f8f5;
            color: #2c3327;
        }
        /* Custom scrollbar for timeline views */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1eb;
        }
        ::-webkit-scrollbar-thumb {
            background: #8a9a5b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6e7c48;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Top Action Bar (No Heading, Just Add Event Button & Filters) -->
    <header class="w-full max-w-6xl mx-auto px-4 pt-6 pb-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <!-- Category Filters -->
        <div id="filter-container" class="flex flex-wrap items-center justify-center sm:justify-start gap-2 w-full sm:w-auto">
            <button onclick="filterCategory('All')" class="filter-btn px-4 py-2 text-sm font-medium rounded-md transition-colors bg-[#8a9a5b] text-white shadow-sm" data-category="All">All</button>
            <button onclick="filterCategory('Milestone')" class="filter-btn px-4 py-2 text-sm font-medium rounded-md transition-colors bg-[#f1f1eb] text-[#2c3327] hover:bg-[#e4e4dc]" data-category="Milestone">Milestone</button>
            <button onclick="filterCategory('Project')" class="filter-btn px-4 py-2 text-sm font-medium rounded-md transition-colors bg-[#f1f1eb] text-[#2c3327] hover:bg-[#e4e4dc]" data-category="Project">Project</button>
            <button onclick="filterCategory('Personal')" class="filter-btn px-4 py-2 text-sm font-medium rounded-md transition-colors bg-[#f1f1eb] text-[#2c3327] hover:bg-[#e4e4dc]" data-category="Personal">Personal</button>
        </div>

        <!-- Add Event Button -->
        <button onclick="openAddModal()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-[#8a9a5b] rounded-md shadow-md hover:bg-[#78864d] active:scale-95 transition-all cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Add Event
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-6">
        <!-- Timeline Switcher (Classic Vertical vs Horizontal Scroll) -->
        <div class="flex items-center justify-end gap-2 mb-6">
            <span class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Layout:</span>
            <button onclick="switchLayout('vertical')" id="layout-btn-vertical" class="px-3 py-1 text-xs font-semibold rounded bg-[#8a9a5b] text-white transition-all">Vertical</button>
            <button onclick="switchLayout('horizontal')" id="layout-btn-horizontal" class="px-3 py-1 text-xs font-semibold rounded bg-[#f1f1eb] text-gray-700 hover:bg-gray-200 transition-all">Horizontal</button>
        </div>

        <!-- Vertical Timeline Container -->
        <div id="timeline-vertical" class="relative border-l-2 border-[#dca1a1] ml-4 sm:ml-8 pl-6 space-y-8">
            <!-- Dynamically populated -->
        </div>

        <!-- Horizontal Timeline Container (Hidden by default) -->
        <div id="timeline-horizontal" class="hidden overflow-x-auto pb-6 pt-4">
            <div id="horizontal-track" class="flex items-center space-x-8 min-w-max border-t-2 border-[#dca1a1] pt-6 relative px-4">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round
